<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing Agent</title>
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #5b21b6;
    --bg: #0f0a1a;
    --card: #1a1230;
    --text: #f4f1fa;
    --muted: #a89cc8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #241a3d 0%, var(--bg) 60%);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; }
  .header .emoji { font-size: 42px; }
  .header h1 {
    font-size: 26px;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, #f5a623, #ec4899, var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header p { color: var(--muted); margin: 0; font-size: 15px; }

  .input-row {
    display: flex;
    gap: 10px;
    background: var(--card);
    padding: 8px;
    border-radius: 14px;
    border: 1px solid #33254f;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
  }
  input::placeholder { color: #6b5f8a; }
  button {
    background: linear-gradient(90deg, var(--purple), #ec4899);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:hover { transform: translateY(-1px); opacity: 0.92; }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #loading {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    margin: 20px 2px;
    font-size: 14px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #3a2a5c;
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .step {
    background: var(--card);
    border: 1px solid #2a1e47;
    border-radius: 14px;
    padding: 18px 20px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .step-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
  }
  .step-title .badge {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #2a1e47;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .tool-name {
    opacity: 0;
    transition: opacity 0.2s ease;
    font-weight: 400;
    color: var(--purple);
    font-size: 12px;
    margin-left: auto;
  }
  .step:hover .tool-name { opacity: 1; }

  .step-body { color: var(--muted); font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }

  .price-highlight {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 10px;
  }
  .price-highlight .amount {
    font-size: 32px; font-weight: 700; color: #f5a623;
  }
  .price-highlight .currency { color: var(--muted); font-size: 13px; }

  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a1e47; font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--text); font-weight: 500; }

  .error { border-left: 3px solid #ef4444; }
  .error .step-body { color: #fca5a5; }

  .warn { border-left: 3px solid #f5a623; }
  .warn .step-body { color: #fbd38d; }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-row input { width: auto; accent-color: var(--purple); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="emoji">🔥</div>
    <h1>Pricing Intelligence Agent</h1>
    <p>Research → Decision → Action, in one click.</p>
  </div>

  <div class="input-row">
    <input id="product" placeholder="e.g. Notion, Linear, Superhuman" />
    <button id="runBtn" onclick="run()">Run pipeline</button>
  </div>

  <label class="toggle-row">
    <input type="checkbox" id="skipValidation" />
    <span>Skip Tenki Sandbox validation (demo comparison)</span>
  </label>

  <div id="loading"><div class="spinner"></div><span>Running pipeline...</span></div>
  <div id="results"></div>
</div>

<script>
async function run() {
  const product = document.getElementById('product').value;
  const skipValidation = document.getElementById('skipValidation').checked;
  const results = document.getElementById('results');
  const loading = document.getElementById('loading');
  const btn = document.getElementById('runBtn');
  if (!product) return;

  results.innerHTML = '';
  loading.style.display = 'flex';
  btn.disabled = true;

  try {
    const res = await fetch('/api/run-pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, skipValidation }),
    });
    const data = await res.json();
    loading.style.display = 'none';
    btn.disabled = false;

    if (data.error) {
      results.innerHTML = `
        <div class="step error">
          <div class="step-title"><span class="badge">!</span> Error</div>
          <div class="step-body">${data.error}</div>
        </div>`;
      return;
    }

    const offeringsCount = data.action?.offerings?.items?.length ?? 0;

    const validateBlock = data.validation.skipped
      ? `<div class="step warn">
          <div class="step-title"><span class="badge">⚠️</span> Validate <span class="tool-name">Tenki Sandbox</span></div>
          <div class="step-body">Skipped — this price went straight to RevenueCat with <strong>no safety check</strong>. This is what every other pricing tool does by default.</div>
        </div>`
      : `<div class="step${data.validation.passed ? '' : ' warn'}">
          <div class="step-title"><span class="badge">🛡️</span> Validate <span class="tool-name">Tenki Sandbox</span></div>
          <div class="kv"><span class="k">Sanity check</span><span class="v">${data.validation.passed ? 'Passed ✅' : 'Rejected ❌'}</span></div>
          <div class="kv"><span class="k">Price change</span><span class="v">${data.validation.delta_pct}%</span></div>
          <div class="kv"><span class="k">Safety threshold</span><span class="v">±${data.validation.threshold_pct}%</span></div>
          <div class="step-body" style="margin-top:8px; font-size:12px;">Threshold researched live via LinkUp: industry-typical price tolerance before churn risk.</div>
        </div>`;

    const actionBlock = data.blocked
      ? `<div class="step error">
          <div class="step-title"><span class="badge">🚫</span> Action <span class="tool-name">RevenueCat</span></div>
          <div class="step-body">Blocked — RevenueCat was never called. The sandbox caught a price swing outside the safety threshold before it could reach production.</div>
        </div>`
      : `<div class="step">
          <div class="step-title"><span class="badge">⚡</span> Action <span class="tool-name">RevenueCat</span></div>
          <div class="kv"><span class="k">Applied price</span><span class="v">$${data.action.applied_price}</span></div>
          <div class="kv"><span class="k">Project</span><span class="v">${data.action.offerings.project_id ?? 'connected'}</span></div>
          <div class="kv"><span class="k">Offerings found</span><span class="v">${offeringsCount}</span></div>
        </div>`;

    results.innerHTML = `
      <div class="step">
        <div class="step-title"><span class="badge">🔎</span> Research <span class="tool-name">LinkUp</span></div>
        <div class="step-body">${data.research}</div>
      </div>

      <div class="step">
        <div class="step-title"><span class="badge">🧠</span> Decision <span class="tool-name">Nebius</span></div>
        <div class="price-highlight">
          <span class="amount">$${data.decision.suggested_price}</span>
          <span class="currency">${data.decision.currency} / month</span>
        </div>
        <div class="step-body">${data.decision.reasoning}</div>
      </div>

      ${validateBlock}

      ${actionBlock}
    `;
  } catch (e) {
    loading.style.display = 'none';
    btn.disabled = false;
    results.innerHTML = `
      <div class="step error">
        <div class="step-title"><span class="badge">!</span> Error</div>
        <div class="step-body">${e.message}</div>
      </div>`;
  }
}

document.getElementById('product').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') run();
});
</script>
</body>
</html>
