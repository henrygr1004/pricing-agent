<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Pricing Agent Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  input, button { font-size: 16px; padding: 10px; }
  input { width: 60%; }
  button { cursor: pointer; }
  .step { border-left: 3px solid #7c3aed; padding: 10px 16px; margin: 16px 0; background: #faf5ff; }
  .step h3 { margin: 0 0 6px 0; }
  pre { white-space: pre-wrap; word-break: break-word; }
  #loading { display: none; color: #7c3aed; }
</style>
</head>
<body>
  <h1>🔥 Pricing Intelligence Agent</h1>
  <p>Research → Decision → Action, en un solo click.</p>
  <input id="product" placeholder="ej. Notion, Linear, Superhuman" />
  <button onclick="run()">Correr pipeline</button>
  <p id="loading">Corriendo pipeline...</p>
  <div id="results"></div>

<script>
async function run() {
  const product = document.getElementById('product').value;
  const results = document.getElementById('results');
  const loading = document.getElementById('loading');
  results.innerHTML = '';
  loading.style.display = 'block';
  try {
    const res = await fetch('/api/run-pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product }),
    });
    const data = await res.json();
    loading.style.display = 'none';
    if (data.error) {
      results.innerHTML = `<div class="step"><h3>Error</h3><pre>${data.error}</pre></div>`;
      return;
    }
    results.innerHTML = `
      <div class="step"><h3>1. Research (LinkUp)</h3><pre>${data.research}</pre></div>
      <div class="step"><h3>2. Decision (Nebius)</h3><pre>${JSON.stringify(data.decision, null, 2)}</pre></div>
      <div class="step"><h3>3. Action (RevenueCat)</h3><pre>${JSON.stringify(data.action, null, 2)}</pre></div>
    `;
  } catch (e) {
    loading.style.display = 'none';
    results.innerHTML = `<div class="step"><h3>Error</h3><pre>${e.message}</pre></div>`;
  }
}
</script>
</body>
</html>
